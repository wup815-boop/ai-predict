name: Daily Batch (Fetch → Pair → Judge)

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Create env file
        run: |
          echo "PH_DEVELOPER_TOKEN=${{ secrets.PH_DEVELOPER_TOKEN }}" >> .env.local
          echo "GITHUB_TOKEN=${{ secrets.GH_PAT }}" >> .env.local
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env.local
          echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" >> .env.local

      - name: Step 1 - Fetch products from Product Hunt + GitHub
        run: npx tsx scripts/fetch-products.ts

      - name: Step 2 - Create pairs + AI predictions
        run: npx tsx scripts/create-pairs.ts

      - name: Step 3 - Judge 30-day-old pairs
        run: npx tsx scripts/judge-pairs.ts