name: Daily Batch (Fetch → Pair → Judge)

on:
  schedule:
    # UTC 06:00 = JST 15:00（NY市場開始前、PH投稿が出揃った後）
    - cron: '0 6 * * *'
  workflow_dispatch: # 手動実行も可能

env:
  PH_DEVELOPER_TOKEN: ${{ secrets.PH_DEVELOPER_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GH_PAT }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Step 1 - Fetch products from Product Hunt + GitHub
        run: npx tsx scripts/fetch-products.ts

      - name: Step 2 - Create pairs + AI predictions
        run: npx tsx scripts/create-pairs.ts

      - name: Step 3 - Judge 30-day-old pairs
        run: npx tsx scripts/judge-pairs.ts
